<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Maquettes, accès réservé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0b0f16;color:#eef2f6;font-family:"Instrument Sans",system-ui,sans-serif}
  .gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:
    radial-gradient(1200px 600px at 80% -10%,rgba(38,150,242,.22),transparent 60%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 64px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 64px),#0b0f16;z-index:50}
  .gate[hidden]{display:none}
  .gate-card{width:100%;max-width:380px;text-align:left}
  .gate-tag{font:500 12px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#f5b301;margin:0 0 18px}
  .gate h1{font:800 44px/0.95 "Big Shoulders Display",sans-serif;text-transform:uppercase;letter-spacing:.01em;margin:0 0 12px}
  .gate p{color:#a9b4c2;margin:0 0 28px;line-height:1.5}
  .gate form{display:flex;gap:8px}
  .gate input{flex:1;min-width:0;padding:14px 16px;border-radius:10px;border:1px solid #2a3442;background:#121925;color:#fff;font:500 16px "Instrument Sans",sans-serif}
  .gate input:focus{outline:2px solid #2696f2;outline-offset:2px}
  .gate button{padding:14px 18px;border:0;border-radius:10px;background:#2696f2;color:#04121f;font:700 15px "Instrument Sans",sans-serif;cursor:pointer}
  .gate button:hover{background:#4aa9f5}
  .gate .err{color:#ff8a7a;font-size:14px;min-height:20px;margin-top:12px}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-card">
    <p class="gate-tag">Accès réservé</p>
    <h1>Maquettes<br>Manutention<br>Côte d'Azur</h1>
    <p>Saisissez le mot de passe reçu pour consulter les propositions.</p>
    <form id="gateForm" autocomplete="off">
      <input id="gatePwd" type="password" placeholder="Mot de passe" aria-label="Mot de passe" autofocus>
      <button type="submit">Ouvrir</button>
    </form>
    <div class="err" id="gateErr" role="alert"></div>
  </div>
</div>
<main id="app"></main>

  var SALT = "sSgask3yQEbozXVGzqWC/Q==";
  var KEY_STORE = "mca-maquettes-pwd";
  var cryptoKey = null;

  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  async function derive(pwd){
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pwd), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:100000,hash:"SHA-256"}, base, {name:"AES-GCM",length:256}, false, ["decrypt"]);
  }
  async function dec(buf){
    var u = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)}, cryptoKey, u.slice(12));
  }
  var mediaCache = {};
  function mediaUrl(path, type){
    if(!mediaCache[path]) mediaCache[path] = fetch(path).then(function(r){return r.arrayBuffer()}).then(dec).then(function(d){return URL.createObjectURL(new Blob([d],{type:type}))});
    return mediaCache[path];
  }
  function loadMedia(el){
    if(el.dataset.encDone) return; el.dataset.encDone = "1";
    var isVideo = el.tagName === "VIDEO";
    if(el.dataset.encPoster) mediaUrl(el.dataset.encPoster,"image/jpeg").then(function(u){el.poster=u});
    if(el.dataset.encSrc) mediaUrl(el.dataset.encSrc, isVideo?"video/mp4":"image/jpeg").then(function(u){
      el.src = u; if(isVideo && el.autoplay){ el.muted = true; el.play().catch(function(){}); }
    });
  }
  function wireMedia(){
    var els = document.querySelectorAll("[data-enc-src],[data-enc-poster]");
    if(!("IntersectionObserver" in window)){ els.forEach(loadMedia); return; }
    var io = new IntersectionObserver(function(entries){entries.forEach(function(e){ if(e.isIntersecting){ loadMedia(e.target); io.unobserve(e.target); } })},{rootMargin:"600px 0px"});
    els.forEach(function(el){ io.observe(el) });
  }
  async function open(pwd, silent){
    try{
      cryptoKey = await derive(pwd);
      var html = new TextDecoder().decode(await dec(b64(PAYLOAD)));
      document.getElementById("app").innerHTML = html;
      document.getElementById("gate").hidden = true;
      try{ localStorage.setItem(KEY_STORE, pwd) }catch(e){}
      wireMedia(); boot();
      if(location.hash){ var t=document.querySelector(location.hash); if(t) t.scrollIntoView(); }
    }catch(e){
      if(!silent) document.getElementById("gateErr").textContent = "Mot de passe incorrect.";
      try{ localStorage.removeItem(KEY_STORE) }catch(e2){}

  }
  function boot(){ if(window.siteBoot) window.siteBoot(); }

  if(PAYLOAD === null){ document.addEventListener("DOMContentLoaded", boot); return; }
  document.getElementById("gateForm").addEventListener("submit", function(ev){ ev.preventDefault(); open(document.getElementById("gatePwd").value, false); });
  var saved = null; try{ saved = localStorage.getItem(KEY_STORE) }catch(e){}
  if(saved) open(saved, true);
})();

<script>
window.siteBoot = function(){
  var app = document.getElementById("app");

  // Apparitions au défilement
  var els = app.querySelectorAll(".rv");
  if("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(en){ en.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }); },{threshold:.12});
    els.forEach(function(el){ io.observe(el); });
  } else els.forEach(function(el){ el.classList.add("in"); });

  // Menu mobile
  var burger = app.querySelector(".burger"), nav = app.querySelector(".nav");
  if(burger && nav) burger.addEventListener("click", function(){ var o = nav.classList.toggle("open"); burger.setAttribute("aria-expanded", o); });

  // Formulaire de devis en étapes (maquette : rien n'est envoyé)
  app.querySelectorAll("form.form").forEach(function(form){
    var steps = form.querySelectorAll("fieldset"), bars = form.querySelectorAll(".prog i");
    var back = form.querySelector(".back"), next = form.querySelector(".next"), i = 0;
    function show(){
      steps.forEach(function(s,k){ s.hidden = k !== i; });
      bars.forEach(function(b,k){ b.classList.toggle("on", k <= i); });
      back.hidden = i === 0;
      next.textContent = i === steps.length - 1 ? "Envoyer ma demande" : "Continuer";
    }
    back.addEventListener("click", function(){ if(i > 0){ i--; show(); } });
    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      if(i < steps.length - 1){ i++; show(); return; }
      form.querySelector(".body").hidden = true;
      form.querySelector(".ok").hidden = false;
    });
    show();
  });

  // Les vidéos d'ambiance se lancent seules, sans le son
  app.querySelectorAll("video[autoplay]").forEach(function(v){ v.muted = true; var p = v.play(); if(p) p.catch(function(){}); });
};

</script>
